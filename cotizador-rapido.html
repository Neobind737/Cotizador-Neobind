<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador rápido — Neobind</title>
<style>
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background:#f5f5f7;
    margin:0;
    display:flex;
    justify-content:center;
    padding:60px 20px;
  }
  .card{
    background:#fff;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.08);
    padding:32px;
    max-width:420px;
    width:100%;
    box-sizing:border-box;
  }
  h2{ margin:0 0 24px; font-size:22px; font-weight:700; color:#222; }
  label{ display:block; font-size:13px; color:#888; margin-bottom:6px; }
  select, input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:15px;
    margin-bottom:20px;
    box-sizing:border-box;
    font-family:inherit;
    background:#fff;
  }
  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:10px 0;
    border-bottom:1px solid #eee;
    gap:12px;
  }
  .row-label{ font-size:14px; color:#333; }
  .row-price{ color:#97979b; font-size:12.5px; }
  .row-value{ font-size:14px; font-weight:600; color:#222; text-align:right; white-space:nowrap; }
  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:18px;
    margin-top:6px;
  }
  .total-label{ font-size:15px; color:#333; }
  .total-value{ font-size:26px; font-weight:800; color:#111; }
  .footer-note{ text-align:center; font-size:11.5px; color:#97979b; margin-top:18px; }
  .unid-input{
    width:50px;
    padding:4px 6px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:13px;
    text-align:center;
    margin:0 4px;
    box-sizing:border-box;
  }
  .copy-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#25D366;
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    margin-top:16px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Cotizador de revestimientos</h2>

  <label>Cliente</label>
  <select id="clienteSelect" onchange="actualizarTotales()"></select>

  <label>Metros cuadrados</label>
  <input id="m2Input" type="number" placeholder="ej: 50" oninput="calcular()">

  <div id="resultados" style="display:none;">
    <div class="row">
      <div class="row-label">Venecitas Neobind <span class="row-price" id="precioVen"></span></div>
      <div class="row-value" id="totalVen"></div>
    </div>
    <div class="row">
      <div class="row-label">Cemenpox <span class="row-price" id="precioCem"></span></div>
      <div class="row-value"><input type="number" id="cemenpoxUnidInput" class="unid-input" oninput="actualizarTotales()"> bolsas = $<span id="totalCem"></span></div>
    </div>
    <div class="row">
      <div class="row-label">Cemento Blanco <span class="row-price" id="precioCB"></span></div>
      <div class="row-value"><input type="number" id="cbUnidInput" class="unid-input" oninput="actualizarTotales()"> bolsas = $<span id="totalCB"></span></div>
    </div>
    <div class="total-row">
      <div class="total-label">Total</div>
      <div class="total-value" id="totalGeneral"></div>
    </div>
  </div>

  <button id="copyBtn" class="copy-btn" style="display:none;" onclick="copiarTexto()">📋 Copiar cotización para WhatsApp</button>

  <div class="footer-note">Precios sujetos a actualización</div>
</div>

<script src="precios.js"></script>
<script>
// Los clientes de Comercio 1 (precio negociado individual) salen de precios.js.
// Además agregamos la lista estándar de distribuidores (Comercio 2) como una
// opción más del desplegable, para no tener que duplicar esos 3 precios acá.
const CLIENTES = { ...PRECIOS.comercio1 };
CLIENTES.comercio2 = { nombre: "DISTRI IVA INCLUIDO", ...PRECIOS.comercio2 };

const REND_CEMENPOX = PRECIOS.rendimientos.cemenpoxM2PorBolsa;
const REND_CB = PRECIOS.rendimientos.cementoBlancoM2PorBolsa;

function f(n){
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

window.addEventListener("DOMContentLoaded", () => {
  const select = document.getElementById("clienteSelect");
  Object.keys(CLIENTES).forEach(key => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = CLIENTES[key].nombre;
    select.appendChild(opt);
  });
});

function calcular(){
  const m2 = parseFloat(document.getElementById("m2Input").value);

  if(!m2 || m2 <= 0){
    document.getElementById("resultados").style.display = "none";
    document.getElementById("copyBtn").style.display = "none";
    return;
  }

  // Sugerimos la cantidad de bolsas según los m², pero quedan editables
  document.getElementById("cemenpoxUnidInput").value = Math.ceil(m2 / REND_CEMENPOX);
  document.getElementById("cbUnidInput").value = Math.ceil(m2 / REND_CB);

  actualizarTotales();
}

function actualizarTotales(){
  const key = document.getElementById("clienteSelect").value;
  const c = CLIENTES[key];
  const m2 = parseFloat(document.getElementById("m2Input").value);

  if(!m2 || m2 <= 0){
    document.getElementById("resultados").style.display = "none";
    document.getElementById("copyBtn").style.display = "none";
    return;
  }

  const bolsasCem = parseFloat(document.getElementById("cemenpoxUnidInput").value) || 0;
  const bolsasCB = parseFloat(document.getElementById("cbUnidInput").value) || 0;

  const totalVen = m2 * c.venecita;
  const totalCem = bolsasCem * c.cemenpox;
  const totalCB = bolsasCB * c.cementoBlanco;
  const total = totalVen + totalCem + totalCB;

  document.getElementById("precioVen").textContent = `($${f(c.venecita)})`;
  document.getElementById("totalVen").textContent = `$${f(totalVen)}`;

  document.getElementById("precioCem").textContent = `($${f(c.cemenpox)})`;
  document.getElementById("totalCem").textContent = f(totalCem);

  document.getElementById("precioCB").textContent = `($${f(c.cementoBlanco)})`;
  document.getElementById("totalCB").textContent = f(totalCB);

  document.getElementById("totalGeneral").textContent = `$${f(total)}`;

  document.getElementById("resultados").style.display = "block";
  document.getElementById("copyBtn").style.display = "block";
}

function copiarTexto(){
  const m2 = document.getElementById("m2Input").value;
  const bolsasCem = document.getElementById("cemenpoxUnidInput").value;
  const bolsasCB = document.getElementById("cbUnidInput").value;
  const totalVen = document.getElementById("totalVen").textContent;
  const totalCem = document.getElementById("totalCem").textContent;
  const totalCB = document.getElementById("totalCB").textContent;
  const totalGeneral = document.getElementById("totalGeneral").textContent;

  const texto = `*Cotización Neobind*
Superficie: ${m2} m²

Venecitas Neobind: ${totalVen}
Cemenpox (${bolsasCem} bolsas): $${totalCem}
Cemento Blanco (${bolsasCB} bolsas): $${totalCB}

*Total: ${totalGeneral}*

El envío se cotiza aparte, consultar costo y modalidad. Precios sujetos a actualización.`;

  navigator.clipboard.writeText(texto).then(() => {
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "✅ Copiado";
    setTimeout(() => { btn.textContent = original; }, 2000);
  }).catch(() => {
    alert("No se pudo copiar. Probá de nuevo o copiá manualmente.");
  });
}
</script>

</body>
</html>
