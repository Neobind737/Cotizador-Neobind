<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Cotizador Neobind</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background: #f5f5f7;
  margin:0;
}

.container {
  max-width: 520px;
  margin: 40px auto;
  background: #fff;
  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.08);
}

.logo { text-align:center; margin-bottom:20px; }
.logo img { width:130px; }

h2 { text-align:center; font-size:24px; margin-bottom:5px; font-weight:600; }

.subtitle {
  text-align:center;
  color:#888;
  font-size:14px;
  margin-bottom:25px;
}

input {
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:16px;
  margin-bottom:25px;
}

/* 🎨 CARDS */
.colors {
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:14px;
}

.color-card {
  position:relative;
  height:120px;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.color-card img {
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.4s;
}

.color-card::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.55), transparent);
}

.color-name {
  position:absolute;
  bottom:10px;
  left:12px;
  color:#ffffff;
  font-weight:600;
  font-size:14px;
  z-index:2;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

.color-card:hover { transform:translateY(-4px); }
.color-card.selected { outline:3px solid #111; }

/* BOTONES */
button {
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

#wa { background:#25D366; }
#copyWA { background:#007AFF; }

.budget {
  margin-top:25px;
  background:#fafafa;
  padding:18px;
  border-radius:14px;
  font-size:14px;
  border:1px solid #eee;
  line-height:1.4;
}

.block { margin-bottom:14px; }
.block-title { font-weight:600; }

/* ⭐ TOTAL MEJORADO */
.total-destacado {
  font-weight:800;
  font-size:20px;
  color:#0a7cff;
}

/* 💰 TRANSFERENCIA DESTACADA */
.transferencia-destacada {
  background: #323232;
  color:#fff;
  padding:14px 16px;
  border-radius:14px;
}

.transferencia-destacada .block-title {
  color:#fff;
  opacity:0.75;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:4px;
}

.valor-grande {
  font-size:23px;
  font-weight:800;
  line-height:1.2;
}

/* 💳 PROMO 3 CUOTAS - MAS SUAVE */
.promo-suave {
  background:#f2f2f3;
  border:1px solid #e6e6e7;
  padding:12px 14px;
  border-radius:12px;
}

.promo-suave .block-title {
  font-size:12px;
  color:#97979b;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:4px;
  font-weight:600;
}

.valor-mediano {
  font-size:16px;
  font-weight:700;
  color:#323232;
}

.promo-total-chico-suave {
  font-size:12px;
  color:#97979b;
  margin-top:2px;
}

/* 🔥 PROMO 12 CUOTAS DESTACADA */
.promo-destacada {
  background: linear-gradient(135deg, #3ebbce, #86ccd1);
  color:#fff;
  padding:14px 16px;
  border-radius:14px;
}

.promo-destacada .block-title {
  color:#fff;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:4px;
}

.promo-cuota-grande {
  font-size:23px;
  font-weight:800;
  line-height:1.2;
}

.promo-total-chico {
  font-size:13px;
  opacity:0.9;
  margin-top:2px;
}

/* 🎉 DESCUENTO */
.precio-tachado {
  text-decoration: line-through;
  opacity:0.65;
  font-size:14px;
  margin-bottom:4px;
}

.descuento-badge {
  display:inline-block;
  background:#16a34a;
  color:#fff;
  font-weight:800;
  font-size:12px;
  padding:5px 12px;
  border-radius:20px;
  margin-bottom:8px;
  letter-spacing:0.3px;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/NEO%20MARCA.png">
</div>

<h2>Cotizá tu pileta</h2>
<div class="subtitle">Venecitas Neobind</div>

<input type="number" id="m2Input" placeholder="Ingresá los m² (ej: 55)" />

<div class="colors">

<div class="color-card" onclick="sel(this,'Blanco Nácar','3619704621491762')">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/img/blanco.jpg">
<div class="color-name">Blanco Nácar</div>
</div>

<div class="color-card" onclick="sel(this,'Agua Marina','3597377153718869')">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/img/aguamarina.jpg">
<div class="color-name">Agua Marina</div>
</div>

<div class="color-card" onclick="sel(this,'Turquesa','3856030544515788')">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/img/turquesa.jpg">
<div class="color-name">Turquesa</div>
</div>

<div class="color-card" onclick="sel(this,'Azul','3620251704771327')">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/img/azul.jpg">
<div class="color-name">Azul</div>
</div>

<div class="color-card" onclick="sel(this,'Verde Esmeralda','4295199693857459')">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/img/verde.jpg">
<div class="color-name">Verde Esmeralda</div>
</div>

<div class="color-card" onclick="sel(this,'Negro','3511570448947533')">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/img/negro.jpg">
<div class="color-name">Negro</div>
</div>

<div class="color-card" onclick="sel(this,'Gris','3580942102015676')">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/img/gris.jpg">
<div class="color-name">Gris</div>
</div>

<div class="color-card" onclick="sel(this,'No definí aún','')">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/img/catalogo.jpg">
<div class="color-name">No definí aún</div>
</div>

</div>

<label style="display:flex; align-items:center; gap:8px; font-size:14px; margin:12px 0; cursor:pointer;">
  <input type="checkbox" id="soloVenecitas" style="width:auto;">
  Cotizar solo Venecitas (sin materiales de instalación)
</label>

<div id="panelAdmin" style="display:none; background:#fff7e6; border:1px solid #f0c36d; border-radius:12px; padding:14px; margin:12px 0;">
  <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:8px; cursor:pointer;">
    <input type="checkbox" id="incluirEnvio" style="width:auto;">
    Incluir envío (el monto no se muestra al cliente)
  </label>
  <input type="number" id="montoEnvio" placeholder="Monto del envío">

  <div style="margin-top:14px; padding-top:14px; border-top:1px solid #f0c36d;">
    <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:8px; cursor:pointer;">
      <input type="checkbox" id="incluirDescuento" style="width:auto;">
      Aplicar descuento (se muestra al cliente, resaltado)
    </label>
    <div style="display:flex; gap:8px;">
      <select id="tipoDescuento" style="width:auto; padding:10px; border-radius:10px; border:1px solid #ddd; font-size:14px; margin-bottom:0;">
        <option value="porcentaje">%</option>
        <option value="monto">$ fijo</option>
      </select>
      <input type="number" id="valorDescuento" placeholder="Valor del descuento" style="flex:1; margin-bottom:0; padding:10px;">
    </div>
  </div>
</div>
  
  <button onclick="calc()">Calcular presupuesto</button>

<div id="budget" class="budget" style="display:none;"></div>

<button id="copyWA" style="display:none;">📋 Copiar para WhatsApp</button>
<button id="downloadImg" style="display:none;">📸 Descargar presupuesto (imagen)</button>
<button id="wa" style="display:none;">📲 Quiero avanzar por WhatsApp</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="precios.js"></script>

<script>
let color = "";
let productId = "";
let whatsappText = "";

if(new URLSearchParams(window.location.search).get("admin") === "1"){
  document.getElementById("panelAdmin").style.display = "block";
}

function sel(el, c, id){
  color = c;
  productId = id;
  document.querySelectorAll('.color-card').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
}

function calc(){
  const m2 = Math.ceil(parseFloat(document.getElementById("m2Input").value));

  if(!m2 || m2<=0) return alert("Ingresá m² válidos");

    const soloVenecitas = document.getElementById("soloVenecitas").checked;

  const montoEnvio = parseFloat(document.getElementById("montoEnvio").value) || 0;
  const incluirEnvio = document.getElementById("incluirEnvio").checked && montoEnvio > 0;
  const envioT = incluirEnvio ? montoEnvio : 0;
  const envioC = incluirEnvio ? precioCuotas(montoEnvio, PRECIOS.financiero.cuotas3) : 0;
  const envioD = incluirEnvio ? precioCuotas(montoEnvio, PRECIOS.financiero.cuotas12) : 0;

  const tipoDescuento = document.getElementById("tipoDescuento").value;
  const valorDescuentoInput = parseFloat(document.getElementById("valorDescuento").value) || 0;
  const aplicaDescuento = document.getElementById("incluirDescuento").checked && valorDescuentoInput > 0;

  function calcDescuento(total){
    if(!aplicaDescuento) return 0;
    return tipoDescuento === "porcentaje" ? Math.round(total * (valorDescuentoInput/100)) : Math.min(total, valorDescuentoInput);
  }

  const colorTexto = color ? color : "Color a definir";

  const f = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");

  // 💎 Venecitas (precio por m²)
  const venT = m2*PRECIOS.consumidorFinal.venecita;   // Transferencia
    const venC = m2*precioCuotas(PRECIOS.consumidorFinal.venecita, PRECIOS.financiero.cuotas3);   // 3 cuotas sin interés
    const venD = m2*precioCuotas(PRECIOS.consumidorFinal.venecita, PRECIOS.financiero.cuotas12);   // 12 cuotas sin interés

    // 🛠 Materiales
const cem = soloVenecitas ? 0 : Math.ceil(m2/PRECIOS.rendimientos.cemenpoxM2PorBolsa);
    const jun = soloVenecitas ? 0 : Math.ceil(m2/PRECIOS.rendimientos.cementoBlancoM2PorBolsa);

    const matT = soloVenecitas ? 0 : (cem*PRECIOS.consumidorFinal.cemenpox + jun*PRECIOS.consumidorFinal.cementoBlanco);   // Transferencia
    const matC = soloVenecitas ? 0 : (cem*precioCuotas(PRECIOS.consumidorFinal.cemenpox, PRECIOS.financiero.cuotas3) + jun*precioCuotas(PRECIOS.consumidorFinal.cementoBlanco, PRECIOS.financiero.cuotas3));   // 3 cuotas sin interés
    const matD = soloVenecitas ? 0 : (cem*precioCuotas(PRECIOS.consumidorFinal.cemenpox, PRECIOS.financiero.cuotas12) + jun*precioCuotas(PRECIOS.consumidorFinal.cementoBlanco, PRECIOS.financiero.cuotas12));   // 12 cuotas sin interés

  // 💰 Totales
  const totT = venT + matT + envioT;

    const detalleMateriales = soloVenecitas ? "" : `<br>Materiales (${cem} Cemenpox + ${jun} Cemento Blanco): $${f(matT)}`;
    const detalleMaterialesWA = soloVenecitas ? "" : `\n• Materiales (${cem} Cemenpox + ${jun} Cemento Blanco): $${f(matT)}`;

  const envioDisclaimer = incluirEnvio ? `<div class="block">📦 Esta cotización incluye el envío del pallet completo (Venecitas + materiales de instalación) a su domicilio.</div>` : "";
  const envioDisclaimerWA = incluirEnvio ? `\n\n📦 _Esta cotización incluye el envío del pallet completo (Venecitas + materiales de instalación) a su domicilio._` : "";
  const totC = venC + matC + envioC;
  const totD = venD + matD + envioD;

  const descT = calcDescuento(totT);
  const descC = calcDescuento(totC);
  const descD = calcDescuento(totD);

  const totTfinal = totT - descT;
  const totCfinal = totC - descC;
  const totDfinal = totD - descD;

  const descHTML = (desc, totalOriginal) => aplicaDescuento ? `<div class="precio-tachado">$${f(totalOriginal)}</div><span class="descuento-badge">🎉 Descuento aplicado: -$${f(desc)}</span>` : "";
  const descWA = (desc, totalOriginal) => aplicaDescuento ? `~$${f(totalOriginal)}~\n🎉 *DESCUENTO APLICADO: -$${f(desc)}*\n` : "";

  const txt = `
<div class="block" style="text-align:center; margin-bottom:18px;">
<img src="https://raw.githubusercontent.com/Neobind737/Cotizador-Neobind/main/NEO%20MARCA.png" style="width:110px;" crossorigin="anonymous">
</div>

<div class="block">
🏊 <b>Presupuesto Neobind</b><br>
${m2} m² — ${colorTexto}
</div>

<div class="block">
<div class="block-title">Detalle (precio transferencia)</div>
Venecitas: $${f(venT)}${detalleMateriales}
</div>

<div class="block transferencia-destacada">
<div class="block-title">💰 Transferencia</div>
${descHTML(descT, totT)}
<div class="valor-grande">$${f(totTfinal)}</div>
</div>

<div class="block promo-suave">
<div class="block-title">💳 Promo 3 cuotas</div>
${descHTML(descC, totC)}
<div class="valor-mediano">3× $${f(totCfinal/3)}</div>
<div class="promo-total-chico-suave">Total: $${f(totCfinal)}</div>
</div>

<div class="block promo-destacada">
<div class="block-title">🔥 Promo 12 cuotas</div>
${descHTML(descD, totD)}
<div class="promo-cuota-grande">12× $${f(totDfinal/12)}</div>
<div class="promo-total-chico">Total: $${f(totDfinal)}</div>
</div>

${envioDisclaimer}

<div class="block">
⚡ Cotización válida por 3 días
</div>
`;

  whatsappText =
`🏊 *PRESUPUESTO NEOBIND*

*${m2} m²* — ${colorTexto}

*Detalle (precio transferencia)*
• Venecitas: $${f(venT)}${detalleMaterialesWA}

💰 *TOTAL TRANSFERENCIA*
${descWA(descT, totT)}*$${f(totTfinal)}*

━━━━━━━━━━━━━━

💳 *Promo 3 cuotas*
${descWA(descC, totC)}$${f(totCfinal)}  (3× $${f(totCfinal/3)})

🔥 *PROMO 12 CUOTAS* 🔥
${descWA(descD, totD)}👉 *12× $${f(totDfinal/12)}*
(Total: $${f(totDfinal)})

⚡ _Cotización válida por 3 días_${envioDisclaimerWA}`;

  const out = document.getElementById("budget");
  out.style.display="block";
  out.innerHTML = txt;

  document.getElementById("copyWA").style.display="block";
  document.getElementById("downloadImg").style.display="block";
  document.getElementById("wa").style.display="block";

  document.getElementById("copyWA").onclick = async ()=>{
    await navigator.clipboard.writeText(whatsappText);
    alert("Copiado para WhatsApp ✅");
  };

  document.getElementById("downloadImg").onclick = ()=>{
    const btn = document.getElementById("downloadImg");
    btn.disabled = true;
    btn.textContent = "Generando imagen...";

    html2canvas(document.getElementById("budget"), {
      backgroundColor: "#ffffff",
      scale: 2,
      useCORS: true
    }).then(canvas => {
      const link = document.createElement("a");
      link.download = `presupuesto-neobind-${m2}m2.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();

      btn.disabled = false;
      btn.textContent = "📸 Descargar presupuesto (imagen)";
    }).catch(err => {
      alert("No se pudo generar la imagen. Probá de nuevo.");
      btn.disabled = false;
      btn.textContent = "📸 Descargar presupuesto (imagen)";
    });
  };

  document.getElementById("wa").onclick = ()=>{
    const msg = `Hola! Quiero avanzar con ${m2} m²${color ? ` en color ${color}` : ""}`;
    const url = productId
      ? `https://wa.me/p/${productId}/5493425945666?text=${encodeURIComponent(msg)}`
      : `https://wa.me/5493425945666?text=${encodeURIComponent(msg)}`;
    window.open(url,"_blank");
  };
}
</script>

</body>
</html>
